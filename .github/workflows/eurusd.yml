
name: EURUSD ntfy monitor

on:
  workflow_dispatch:
  push:
    paths:
      - monitor.py
      - test_monitor.py
      - requirements.txt
      - .github/workflows/eurusd.yml
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: write

concurrency:
  group: eurusd-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test freshness and deduplication
        run: python -m unittest -v

      - name: Test ntfy delivery after code change
        if: github.event_name == 'push'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -c "from monitor import notify; notify('EURUSD monitor test', 'A javitott monitor GitHub Actions ntfy kapcsolattesztje. Ez nem kereskedesi jelzes.')"

      - name: Run EURUSD monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -u monitor.py
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Second pass checks persisted notification deduplication"
            python -u monitor.py
          fi

      - name: Save alert state
        if: always()
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update EURUSD alert state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
