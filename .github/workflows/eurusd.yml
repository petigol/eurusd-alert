name: EURUSD ntfy monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - monitor.py
      - test_monitor.py
      - .github/workflows/eurusd.yml

permissions:
  contents: write

concurrency:
  group: eurusd-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replay tests
        run: python3 -m unittest -v

      - name: Test ntfy publication
        if: github.event_name == 'push'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python3 monitor.py test-ntfy

      - name: Probe Yahoo M5 availability
        if: github.event_name == 'push' && (success() || failure())
        run: python3 monitor.py probe

      - name: Monitor London session
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -u monitor.py watch
